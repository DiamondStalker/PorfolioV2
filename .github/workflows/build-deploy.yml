name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v3

    - name: Setup Node.js 📦
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies 🔧
      run: npm ci

    - name: Information Enviroment ✨
      run: echo "Enviroments \n Secrets {{secrets.RENDER_API_URL}} || Enviroment ${{ vars.RENDER_API_URL }} "
      
    - name: Build for production 🏗️
      run: npm run build
      env:
        # URL de la API desplegada en Render
        VITE_API_BASE_URL: ${{ secrets.RENDER_API_URL }}
        VITE_APP_ENVIRONMENT: production
        VITE_GITHUB_USER: DiamondStalker

    - name: Deploy to GitHub Pages 🚀
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GH_TOKEN }}
        publish_dir: ./dist
