name: React App Github Deploy

on:
  push:
    branches:
      - "master"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Debug - Print all variables
        run: |
          echo "=== SECRETS (masked) ==="
          echo "GH_TOKEN: ${{ secrets.GH_TOKEN }}"
          echo "RENDER_API_URL: ${{ secrets.RENDER_API_URL }}"
          echo "GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}"
          echo ""
          echo "=== ENVIRONMENT VARIABLES ==="
          echo "RENDER_API_URL: $RENDER_API_URL"
          echo "VITE_API_BASE_URL: $VITE_API_BASE_URL"
          echo ""
        env:
          RENDER_API_URL: ${{ secrets.RENDER_API_URL }}
          VITE_API_BASE_URL: ${{ secrets.RENDER_API_URL }}/api
        
      - name: Install & build
        run: npm i && npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.RENDER_API_URL }}/api
        
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@4.1.1
        with:
          branch: gh-pages
          folder: dist
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          
